name: Refresh Android attestation mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download official status list
        run: |
          curl --fail --show-error --silent \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            --retry 3 --retry-all-errors \
            'https://android.googleapis.com/attestation/status' \
            --output /tmp/android-attestation-status.json

      - name: Load signing key
        env:
          MIRROR_PRIVATE_KEY: ${{ secrets.ATTESTATION_MIRROR_PRIVATE_KEY }}
        run: |
          test -n "$MIRROR_PRIVATE_KEY"
          printf '%s' "$MIRROR_PRIVATE_KEY" > /tmp/attestation-mirror-private.pem
          chmod 600 /tmp/attestation-mirror-private.pem

      - name: Build signed snapshot
        run: |
          python3 scripts/build_snapshot.py \
            --input /tmp/android-attestation-status.json \
            --private-key /tmp/attestation-mirror-private.pem \
            --output /tmp/android-attestation-snapshot.json \
            --valid-seconds 172800
          rm -f /tmp/attestation-mirror-private.pem

      - name: Publish status branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin status || true
          if git show-ref --verify --quiet refs/remotes/origin/status; then
            git checkout -B status origin/status
          else
            git checkout --orphan status
            git rm -rf .
          fi
          cp /tmp/android-attestation-snapshot.json android-attestation-snapshot.json
          git add android-attestation-snapshot.json
          git diff --cached --quiet || git commit -m 'Refresh Android attestation status'
          git push origin status
